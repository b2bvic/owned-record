name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/setup.sh .claude/hooks/*.sh tests/test_setup.sh
      - name: Run routing tests
        run: python3 tests/test_route_domain.py
      - name: Run setup tests
        run: bash tests/test_setup.sh
