name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check shell syntax
        run: bash -n scripts/setup.sh .claude/hooks/*.sh tests/test_setup.sh
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shell lint
        run: shellcheck scripts/setup.sh .claude/hooks/*.sh tests/test_setup.sh
      - name: Compile Python
        run: python3 -m compileall -q scripts .claude/hooks
      - name: Run routing tests
        run: python3 -m unittest discover -s tests -v
      - name: Run setup tests
        run: bash tests/test_setup.sh
      - name: Install Python lint tool
        run: python3 -m pip install ruff==0.16.10
      - name: Python lint
        run: ruff check --select F,E9 scripts .claude/hooks/route_domain.py tests
      - name: Check isolated demo
        run: bash -n examples/demo.sh && shellcheck examples/demo.sh && bash examples/demo.sh

  components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [session-ledger, cc-bridge, web2md, route-domain, pretool-memory, voice-calibration]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install shell test dependency
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - name: Install web conversion dependencies
        if: matrix.component == 'web2md'
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run standard-library component suite
        if: matrix.component != 'web2md'
        run: python3 -m unittest discover -s tests -v
      - name: Run web conversion suite
        if: matrix.component == 'web2md'
        run: python3 -m pytest -q
